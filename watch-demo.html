      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 18px;
      background: #000;
      box-shadow: 0 25px 70px rgb(0 0 0 / 45%);

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;

      border: 1px solid rgb(255 255 255 / 25%);
      border-radius: 999px;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }

      background: #5b5fc7;

    a:hover,
